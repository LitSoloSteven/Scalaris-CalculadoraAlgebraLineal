<template id="presentacion-plantilla">
  <div id="aplicacion-presentacion-fondo" aria-hidden="true">
    <div class="presentacion-emblema">
      <img id="presentacion-logotipo" class="marca-logotipo-reactivo" alt="" width="80" height="80">
      <svg id="presentacion-anillo" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="58" fill="none" stroke="currentColor" stroke-width="2"
                stroke-dasharray="365" stroke-dashoffset="365"></circle>
      </svg>
    </div>
    <div class="presentacion-textos">
      <span id="presentacion-nombre">Scalaris</span>
      <span id="presentacion-organizacion">UAM</span>
    </div>
    <div id="presentacion-barra"></div>
    <svg class="presentacion-definiciones" width="0" height="0">
      <defs>
        <mask id="presentacion-mascara" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
          <rect width="100%" height="100%" fill="white"></rect>
          <circle id="presentacion-abertura" fill="black"></circle>
        </mask>
      </defs>
    </svg>
  </div>
</template>
