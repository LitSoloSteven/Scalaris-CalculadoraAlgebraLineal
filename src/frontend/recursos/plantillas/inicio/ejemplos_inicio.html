<figure class="inicio-ejemplo" aria-labelledby="inicio-ejemplo-titulo" data-ejemplo-inicio data-ejemplo-clave="$clave" data-ejemplo-mensaje="$mensaje">
  <figcaption class="inicio-ejemplo-cabecera">
    <div>
      <span class="inicio-ejemplo-etiqueta">Ejemplo</span>
      <h2 id="inicio-ejemplo-titulo">$titulo</h2>
    </div>
    <span class="inicio-ejemplo-operacion" role="math" aria-label="$etiqueta_operacion">
      $operacion
    </span>
  </figcaption>
  <div class="inicio-ejemplo-etapas">
    $etapas
  </div>
  <div class="inicio-ejemplo-acciones">
    <button class="inicio-ejemplo-accion" type="button" data-ejemplo-reproducir>
      <span class="inicio-ejemplo-icono" aria-hidden="true">⟲</span>
      Reproducir
    </button>
    <a class="inicio-ejemplo-accion inicio-ejemplo-enlace" href="$enlace" aria-label="$etiqueta_enlace">
      Ver módulo
      <span class="inicio-ejemplo-icono" aria-hidden="true">→</span>
    </a>
  </div>
  <span class="inicio-ejemplo-estado" role="status" aria-live="polite" aria-atomic="true" data-ejemplo-estado></span>
</figure>
